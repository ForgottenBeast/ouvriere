content:
  - name: landing
    label: Page d’accueil
    type: file
    path: src/data/landing.json
    format: json
    fields:
      - name: menuLabels
        label: Menu
        type: string
        required: true
        list:
          min: 3
          max: 3
        options:
          minlength: 1
          maxlength: 80
      - name: video
        label: Vidéo
        type: object
        required: true
        fields:
          - name: streamUid
            label: Identifiant Cloudflare Stream
            type: string
            required: true
            pattern:
              regex: "^[a-f0-9]{32}$"
              message: "L’identifiant doit contenir 32 caractères hexadécimaux minuscules."
            options:
              minlength: 32
              maxlength: 32
